openapi: 3.0.3
info:
  title: HearWell API
  version: 0.1.0
paths:
  /api/questionnaires/:
    get:
      operationId: questionnaires_list
      tags:
      - questionnaires
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Questionnaire'
          description: ''
  /api/questionnaires/{id}/:
    get:
      operationId: questionnaires_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - questionnaires
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuestionnaireDetail'
          description: ''
  /api/submissions/:
    get:
      operationId: submissions_list
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      tags:
      - submissions
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedSubmissionList'
          description: ''
    post:
      operationId: submissions_create
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
        description: UUID made when answering starts; resend the same one on retry.
        required: true
      tags:
      - submissions
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmissionCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SubmissionCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SubmissionCreate'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionDetail'
          description: ''
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionDetail'
          description: 'Retry: the first submission'
        '400':
          description: Invalid answers or Idempotency-Key
        '409':
          description: Idempotency-Key used with different answers
  /api/submissions/{id}/:
    get:
      operationId: submissions_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - submissions
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionDetail'
          description: ''
components:
  schemas:
    Answer:
      type: object
      properties:
        number:
          type: integer
        text:
          type: string
        score:
          allOf:
          - $ref: '#/components/schemas/ScoreEnum'
          minimum: -2147483648
          maximum: 2147483647
        label:
          type: string
      required:
      - label
      - number
      - score
      - text
    AnswerInput:
      type: object
      properties:
        question:
          type: integer
        score:
          type: integer
      required:
      - question
      - score
    Choice:
      type: object
      properties:
        value:
          type: integer
        label:
          type: string
      required:
      - label
      - value
    Level:
      type: object
      properties:
        code:
          type: string
        text:
          type: string
      required:
      - code
      - text
    LevelBand:
      type: object
      properties:
        code:
          type: string
        text:
          type: string
        max:
          type: integer
      required:
      - code
      - max
      - text
    PaginatedSubmissionList:
      type: object
      required:
      - results
      properties:
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?cursor=cD00ODY%3D"
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?cursor=cj0xJnA9NDg3
        results:
          type: array
          items:
            $ref: '#/components/schemas/Submission'
    Question:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        number:
          type: integer
        text:
          type: string
        choices:
          type: array
          items:
            $ref: '#/components/schemas/Choice'
          readOnly: true
      required:
      - choices
      - id
      - number
      - text
    Questionnaire:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        code:
          type: string
          maxLength: 32
          pattern: ^[-a-zA-Z0-9_]+$
        name:
          type: string
        levels:
          type: array
          items:
            $ref: '#/components/schemas/LevelBand'
          readOnly: true
      required:
      - code
      - id
      - levels
      - name
    QuestionnaireDetail:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        code:
          type: string
          maxLength: 32
          pattern: ^[-a-zA-Z0-9_]+$
        name:
          type: string
        levels:
          type: array
          items:
            $ref: '#/components/schemas/LevelBand'
          readOnly: true
        questions:
          type: array
          items:
            $ref: '#/components/schemas/Question'
      required:
      - code
      - id
      - levels
      - name
      - questions
    QuestionnaireSummary:
      type: object
      properties:
        code:
          type: string
          maxLength: 32
          pattern: ^[-a-zA-Z0-9_]+$
        name:
          type: string
      required:
      - code
      - name
    ScoreEnum:
      enum:
      - 4
      - 2
      - 0
      type: integer
      description: |-
        * `4` - 常常
        * `2` - 有時
        * `0` - 從未
    Scores:
      type: object
      properties:
        total:
          type: integer
        emotional:
          type: integer
        social:
          type: integer
      required:
      - emotional
      - social
      - total
    Submission:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        questionnaire:
          $ref: '#/components/schemas/QuestionnaireSummary'
        wearing_hearing_aid:
          type: boolean
          nullable: true
        scores:
          $ref: '#/components/schemas/Scores'
        level:
          $ref: '#/components/schemas/Level'
      required:
      - created_at
      - id
      - level
      - questionnaire
      - scores
      - wearing_hearing_aid
    SubmissionCreate:
      type: object
      properties:
        questionnaire:
          type: integer
        wearing_hearing_aid:
          type: boolean
        answers:
          type: array
          items:
            $ref: '#/components/schemas/AnswerInput'
      required:
      - answers
      - questionnaire
      - wearing_hearing_aid
    SubmissionDetail:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        questionnaire:
          $ref: '#/components/schemas/QuestionnaireSummary'
        wearing_hearing_aid:
          type: boolean
          nullable: true
        scores:
          $ref: '#/components/schemas/Scores'
        level:
          $ref: '#/components/schemas/Level'
        advice:
          type: string
          readOnly: true
        answers:
          type: array
          items:
            $ref: '#/components/schemas/Answer'
      required:
      - advice
      - answers
      - created_at
      - id
      - level
      - questionnaire
      - scores
      - wearing_hearing_aid
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
