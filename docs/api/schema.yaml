openapi: 3.0.3
info:
  title: HearWell API
  version: 0.1.0
paths:
  /api/audiograms/:
    post:
      operationId: audiograms_create
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
        description: UUID made when the input page opens; resend the same one on retry.
        required: true
      tags:
      - audiograms
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AudiogramCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AudiogramCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AudiogramCreate'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Audiogram'
          description: ''
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Audiogram'
          description: 'Retry: the first audiogram'
        '400':
          description: Invalid points, date or Idempotency-Key
        '409':
          description: Idempotency-Key used with a different audiogram
  /api/audiograms/{id}/:
    get:
      operationId: audiograms_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - audiograms
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Audiogram'
          description: ''
    put:
      operationId: audiograms_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - audiograms
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AudiogramCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AudiogramCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AudiogramCreate'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Audiogram'
          description: ''
        '400':
          description: Invalid points or date; nothing changed
        '404':
          description: Not this user's audiogram
  /api/questionnaires/:
    get:
      operationId: questionnaires_list
      tags:
      - questionnaires
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Questionnaire'
          description: ''
  /api/questionnaires/{id}/:
    get:
      operationId: questionnaires_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - questionnaires
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuestionnaireDetail'
          description: ''
  /api/submissions/:
    get:
      operationId: submissions_list
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      tags:
      - submissions
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedSubmissionList'
          description: ''
    post:
      operationId: submissions_create
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
        description: UUID made when answering starts; resend the same one on retry.
        required: true
      tags:
      - submissions
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmissionCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SubmissionCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SubmissionCreate'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionDetail'
          description: ''
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionDetail'
          description: 'Retry: the first submission'
        '400':
          description: Invalid answers or Idempotency-Key
        '409':
          description: Idempotency-Key used with different answers
  /api/submissions/{id}/:
    get:
      operationId: submissions_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - submissions
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionDetail'
          description: ''
components:
  schemas:
    Answer:
      type: object
      properties:
        number:
          type: integer
        text:
          type: string
        score:
          type: integer
          maximum: 10
          minimum: 0
          nullable: true
        label:
          type: string
      required:
      - label
      - number
      - score
      - text
    AnswerInput:
      type: object
      properties:
        question:
          type: integer
        score:
          type: integer
          nullable: true
      required:
      - question
      - score
    Audiogram:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        tested_on:
          type: string
          format: date
        created_at:
          type: string
          format: date-time
          readOnly: true
        points:
          type: array
          items:
            $ref: '#/components/schemas/AudiogramPoint'
        interpretation:
          $ref: '#/components/schemas/Interpretation'
      required:
      - created_at
      - id
      - interpretation
      - points
      - tested_on
    AudiogramCreate:
      type: object
      properties:
        tested_on:
          type: string
          format: date
        points:
          type: array
          items:
            $ref: '#/components/schemas/AudiogramPointInput'
      required:
      - points
      - tested_on
    AudiogramPoint:
      type: object
      properties:
        ear:
          $ref: '#/components/schemas/EarEnum'
        conduction:
          $ref: '#/components/schemas/ConductionEnum'
        frequency:
          type: integer
          maximum: 32767
          minimum: 0
        db:
          type: integer
          maximum: 32767
          minimum: -32768
        no_response:
          type: boolean
        masked:
          type: boolean
      required:
      - conduction
      - db
      - ear
      - frequency
    AudiogramPointInput:
      type: object
      properties:
        ear:
          $ref: '#/components/schemas/EarEnum'
        conduction:
          $ref: '#/components/schemas/ConductionEnum'
        frequency:
          type: integer
        db:
          type: integer
        no_response:
          type: boolean
          default: false
        masked:
          type: boolean
          default: false
      required:
      - conduction
      - db
      - ear
      - frequency
    Choice:
      type: object
      properties:
        value:
          type: integer
          nullable: true
        label:
          type: string
      required:
      - label
      - value
    ConductionEnum:
      enum:
      - air
      - bone
      type: string
      description: |-
        * `air` - 氣導
        * `bone` - 骨導
    EarEnum:
      enum:
      - right
      - left
      type: string
      description: |-
        * `right` - 右耳
        * `left` - 左耳
    EarResult:
      type: object
      properties:
        pta:
          type: number
          format: double
          nullable: true
        degree:
          type: string
          nullable: true
        type:
          type: string
          nullable: true
        no_response:
          type: boolean
      required:
      - degree
      - no_response
      - pta
      - type
    Interpretation:
      type: object
      properties:
        right:
          $ref: '#/components/schemas/EarResult'
        left:
          $ref: '#/components/schemas/EarResult'
      required:
      - left
      - right
    Level:
      type: object
      properties:
        code:
          type: string
        text:
          type: string
      required:
      - code
      - text
    LevelBand:
      type: object
      properties:
        code:
          type: string
        text:
          type: string
        max:
          type: integer
      required:
      - code
      - max
      - text
    PaginatedSubmissionList:
      type: object
      required:
      - results
      properties:
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?cursor=cD00ODY%3D"
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?cursor=cj0xJnA9NDg3
        results:
          type: array
          items:
            $ref: '#/components/schemas/Submission'
    Question:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        number:
          type: integer
        text:
          type: string
        choices:
          type: array
          items:
            $ref: '#/components/schemas/Choice'
          readOnly: true
        scale:
          allOf:
          - $ref: '#/components/schemas/Scale'
          nullable: true
      required:
      - choices
      - id
      - number
      - text
    Questionnaire:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        code:
          type: string
          maxLength: 32
          pattern: ^[-a-zA-Z0-9_]+$
        name:
          type: string
        levels:
          type: array
          items:
            $ref: '#/components/schemas/LevelBand'
          readOnly: true
      required:
      - code
      - id
      - levels
      - name
    QuestionnaireDetail:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        code:
          type: string
          maxLength: 32
          pattern: ^[-a-zA-Z0-9_]+$
        name:
          type: string
        levels:
          type: array
          items:
            $ref: '#/components/schemas/LevelBand'
          readOnly: true
        questions:
          type: array
          items:
            $ref: '#/components/schemas/Question'
      required:
      - code
      - id
      - levels
      - name
      - questions
    QuestionnaireSummary:
      type: object
      properties:
        code:
          type: string
          maxLength: 32
          pattern: ^[-a-zA-Z0-9_]+$
        name:
          type: string
      required:
      - code
      - name
    Scale:
      type: object
      properties:
        min_label:
          type: string
        max_label:
          type: string
      required:
      - max_label
      - min_label
    Scores:
      type: object
      properties:
        total:
          type: integer
        emotional:
          type: integer
        social:
          type: integer
      required:
      - emotional
      - social
      - total
    Submission:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        questionnaire:
          $ref: '#/components/schemas/QuestionnaireSummary'
        wearing_hearing_aid:
          type: boolean
          nullable: true
        scores:
          allOf:
          - $ref: '#/components/schemas/Scores'
          nullable: true
        level:
          allOf:
          - $ref: '#/components/schemas/Level'
          nullable: true
        average_score:
          type: string
          format: decimal
          pattern: ^-?\d{0,2}(?:\.\d{0,1})?$
          nullable: true
        average_unavailable_reason:
          type: string
          nullable: true
      required:
      - created_at
      - id
      - level
      - questionnaire
      - scores
      - wearing_hearing_aid
    SubmissionCreate:
      type: object
      properties:
        questionnaire:
          type: integer
        wearing_hearing_aid:
          type: boolean
        answers:
          type: array
          items:
            $ref: '#/components/schemas/AnswerInput'
      required:
      - answers
      - questionnaire
      - wearing_hearing_aid
    SubmissionDetail:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        questionnaire:
          $ref: '#/components/schemas/QuestionnaireSummary'
        wearing_hearing_aid:
          type: boolean
          nullable: true
        scores:
          allOf:
          - $ref: '#/components/schemas/Scores'
          nullable: true
        level:
          allOf:
          - $ref: '#/components/schemas/Level'
          nullable: true
        average_score:
          type: string
          format: decimal
          pattern: ^-?\d{0,2}(?:\.\d{0,1})?$
          nullable: true
        average_unavailable_reason:
          type: string
          nullable: true
        advice:
          type: string
          nullable: true
          readOnly: true
        answers:
          type: array
          items:
            $ref: '#/components/schemas/Answer'
      required:
      - advice
      - answers
      - created_at
      - id
      - level
      - questionnaire
      - scores
      - wearing_hearing_aid
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
