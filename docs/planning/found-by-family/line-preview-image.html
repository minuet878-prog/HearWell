<!doctype html>
<!-- The LINE preview image, design C as the owner picked it in mockup-588-line-preview.html on
     2026-11-16 (#588). screening/static/screening/line-preview.png is exported from this file at
     1200x630 (#590): open it from the repo after `npm run build --prefix frontend`, so the site's
     own Noto Sans TC loads from the built site.css, and take a 1200x630 screenshot of #image. -->
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>LINE 預覽圖（輸出用）</title>
<link rel="stylesheet" href="../../../screening/static/screening/frontend/site.css">
<style>
  :root { --primary: #1f4e8c; --primary-2: #1d6f99; --primary-soft: #eef3fa; --primary-soft-deep: #d6e2f2;
          --heading: #212529; --body: #343a40; --muted: #4a5460; }
  html, body { margin: 0; padding: 0; background: #fff; }
  /* Every length is a share of the width (--w), as in the mockup. */
  #image { --w: 1200px; width: var(--w); height: calc(var(--w) * .525); font-size: calc(var(--w) / 60);
           position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center;
           background: var(--primary-soft); color: var(--primary); font-family: "Noto Sans TC", sans-serif; }
  .stack { display: flex; flex-direction: column; align-items: center; position: relative; }
  .tile { width: 9em; height: 9em; border-radius: 2em; background: linear-gradient(135deg, var(--primary), var(--primary-2));
          color: #fff; display: flex; align-items: center; justify-content: center; margin-bottom: .4em; }
  .tile svg { width: 6.5em; height: auto; }
  .name { font-weight: 700; font-size: 5.8em; line-height: 1.15; letter-spacing: .06em; margin-right: -.06em; color: var(--heading); }
  .tint { color: var(--primary); }
  .tag { font-size: 2.5em; font-weight: 500; line-height: 1.3; letter-spacing: .12em; margin-right: -.12em; color: var(--body); }
  .by { font-size: 1.45em; line-height: 1.3; margin-top: .9em; color: var(--muted); }
  /* Sound waves: arcs outside the centre square, decoration only. */
  .waves { position: absolute; top: 50%; width: 0; height: 0; }
  .waves.left { left: 13.5em; }
  .waves.right { right: 13.5em; }
  .waves i { position: absolute; top: 0; border: .55em solid var(--primary-soft-deep); border-radius: 50%;
             transform: translate(-50%, -50%); clip-path: inset(0 0 0 62%); }
  .waves.left i { clip-path: inset(0 62% 0 0); left: 9em; }
  .waves.right i { left: -9em; }
  .waves i:nth-child(1) { width: 9em; height: 9em; }
  .waves i:nth-child(2) { width: 15em; height: 15em; }
  .waves i:nth-child(3) { width: 21em; height: 21em; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <!-- The bird of screening/static/screening/pwa/icon.svg. -->
  <mask id="bird">
    <path fill="#fff" fill-rule="evenodd" d="M12 50c1-3 3-6 5-9 0-14 9-24 21-24a11 11 0 0 1 11 9l7 4-7 3c-2 11-10 17-21 17zM40 25a2.8 2.8 0 1 0 .01 0z"/>
    <path fill="none" stroke="#000" stroke-width="3.9" stroke-linecap="round" stroke-linejoin="round" transform="translate(28 33.5) scale(.9) translate(-28.5 -35)" d="M22 33a6.5 6.5 0 0 1 13 0c0 4-4 5-4 8.5a3.3 3.3 0 0 1-6 2"/>
  </mask>
</defs></svg>
<div id="image">
  <div class="waves left"><i></i><i></i><i></i></div>
  <div class="waves right"><i></i><i></i><i></i></div>
  <div class="stack">
    <div class="tile"><svg viewBox="9 14 50 39" aria-hidden="true"><rect width="64" height="64" fill="currentColor" mask="url(#bird)"/></svg></div>
    <div class="name">聽<span class="tint">伴</span></div>
    <div class="tag">聽力自我照護</div>
    <div class="by">內容由台灣執業聽力師設計與審定</div>
  </div>
</div>
</body>
</html>
