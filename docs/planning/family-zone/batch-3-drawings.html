<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>保養線條圖審查</title>
<style>
  :root { --brand: #1f4e8c; --ink: #1c2733; --muted: #52606d; --line: #d5dce4; --tint: #e7eef7; --page: #f6f7f9; --card: #fff; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 24px 16px 48px; background: var(--page); color: var(--ink); font: 18px/1.6 "PingFang TC", "Noto Sans TC", sans-serif; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; color: var(--brand); }
  h2 { font-size: 1.2rem; margin: 28px 0 12px; }
  .lead { margin: 0 0 8px; color: var(--muted); }
  .grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); max-width: 1120px; }
  figure { margin: 0; padding: 12px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; }
  figcaption { margin-top: 8px; font-size: .95rem; }
  figcaption b { display: block; }
  svg { display: block; width: 100%; height: auto; background: #fbfcfd; border-radius: 8px; }
  svg * { fill: none; stroke: var(--brand); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
  svg .soft { fill: var(--tint); }
  svg .thin { stroke-width: 1.6; }
  svg .thick { stroke-width: 4; }
  svg .dot { fill: var(--brand); stroke: none; }
  svg .tube { stroke-width: 8; }
  svg .tube-in { stroke: var(--tint); stroke-width: 3.6; }
  svg .lens { fill: #fff; fill-opacity: 0.25; }
</style>
</head>
<body>
<h1>日常保養的線條圖（第二版）</h1>
<p class="lead">不分廠牌的線條圖，共 9 張。圖只是輔助，每一步的文字都能單獨看懂。請逐張確認：外型對不對、動作會不會誤導。</p>
<h2>掛在耳後</h2>

<figure><svg viewBox="0 0 240 160" aria-hidden="true"><g transform="translate(62 -14) rotate(0) scale(1.7)"><path class="soft" d="M18 44C20 33 43 31 47 44C51 57 47 72 35 76C30 78 28 85 20 89C14 91 9 85 11 78C13 72 13 63 14 56C14 51 16 48 18 44Z"/><ellipse class="thin" cx="15" cy="84" rx="3.2" ry="2.4"/><circle class="thin" cx="39" cy="52" r="2.2"/></g><g transform="translate(98 138) rotate(-22) scale(1.1)"><rect class="soft" x="24" y="-4.5" width="88" height="9" rx="4.5"/><path d="M24 0H9"/><path class="thin" d="M9 -6L-5 -9M9 -3L-7 -4.5M9 0H-8M9 3L-7 4.5M9 6L-5 9"/></g></svg><figcaption><b>2. 清耳垢</b>工具清耳模出口的耳垢。</figcaption></figure>
<figure><svg viewBox="0 0 240 160" aria-hidden="true"><path class="soft" d="M6 62C30 40 60 34 92 34L112 50L132 34C164 32 196 40 226 64L218 76C192 54 164 48 132 50L112 54L92 50C62 50 34 56 16 74Z"/><circle class="lens" cx="112" cy="46" r="38"/><circle class="thin" cx="112" cy="46" r="32"/><rect class="soft" x="0" y="-6" width="56" height="12" rx="6" transform="translate(142 74) rotate(45)"/></svg><figcaption><b>3. 看導管</b>放大鏡看導管有沒有折到或裂開。</figcaption></figure>
<figure><svg viewBox="0 0 240 160" aria-hidden="true"><path d="M24 72C24 118 62 146 120 146C178 146 216 118 216 72"/><path d="M16 72H224"/><path class="thin" d="M30 92c14-7 26 7 40 0s26 7 40 0 26 7 40 0 26 7 40 0 16 3 22 0"/><g transform="translate(70 44) rotate(0) scale(0.95)"><path class="soft" d="M18 44C20 33 43 31 47 44C51 57 47 72 35 76C30 78 28 85 20 89C14 91 9 85 11 78C13 72 13 63 14 56C14 51 16 48 18 44Z"/><ellipse class="thin" cx="15" cy="84" rx="3.2" ry="2.4"/><circle class="thin" cx="39" cy="52" r="2.2"/></g><path class="tube" d="M100 78C104 58 104 38 122 24"/><path class="tube-in" d="M100 78C104 58 104 38 122 24"/><circle class="thin" cx="160" cy="118" r="4.5"/><circle class="thin" cx="176" cy="106" r="3"/><g transform="translate(152 8) rotate(0) scale(0.52)"><path class="tube" d="M72 22C60 5 38 5 30 24L31 38"/><path class="tube-in" d="M72 22C60 5 38 5 30 24L31 38"/><path class="soft" d="M78 18C92 12 108 22 113 44C118 68 114 92 102 104C95 111 85 108 84 98C83 80 78 62 68 46C60 34 64 24 78 18Z"/><path class="thin" d="M85 86C93 91 105 89 114 80"/><path class="thin" d="M97 92l2 5"/><circle class="dot" cx="79" cy="27" r="1.7"/><circle class="dot" cx="88" cy="24" r="1.7"/><path class="thick" d="M108 48l3 14"/></g></svg><figcaption><b>4. 洗耳模</b>耳模連導管泡溫肥皂水，機身拿開不碰水。</figcaption></figure>
<figure><svg viewBox="0 0 240 160" aria-hidden="true"><path class="soft" d="M44 76C44 34 62 18 120 18C178 18 196 34 196 76Z"/><path class="thin" d="M58 70C60 42 74 30 120 30C166 30 180 42 182 70"/><rect x="26" y="76" width="188" height="68" rx="16"/><rect class="thin" x="38" y="86" width="164" height="48" rx="10"/><path class="thick" d="M104 76v-6M136 76v-6"/><g transform="translate(58 88) rotate(0) scale(0.4)"><path class="tube" d="M72 22C60 5 38 5 30 24L31 38"/><path class="tube-in" d="M72 22C60 5 38 5 30 24L31 38"/><path class="soft" d="M78 18C92 12 108 22 113 44C118 68 114 92 102 104C95 111 85 108 84 98C83 80 78 62 68 46C60 34 64 24 78 18Z"/><path class="thin" d="M85 86C93 91 105 89 114 80"/><path class="thin" d="M97 92l2 5"/><circle class="dot" cx="79" cy="27" r="1.7"/><circle class="dot" cx="88" cy="24" r="1.7"/><path class="thick" d="M108 48l3 14"/><path class="soft" d="M18 44C20 33 43 31 47 44C51 57 47 72 35 76C30 78 28 85 20 89C14 91 9 85 11 78C13 72 13 63 14 56C14 51 16 48 18 44Z"/><ellipse class="thin" cx="15" cy="84" rx="3.2" ry="2.4"/><circle class="thin" cx="39" cy="52" r="2.2"/></g><g transform="translate(132 88) rotate(0) scale(0.4)"><path class="tube" d="M72 22C60 5 38 5 30 24L31 38"/><path class="tube-in" d="M72 22C60 5 38 5 30 24L31 38"/><path class="soft" d="M78 18C92 12 108 22 113 44C118 68 114 92 102 104C95 111 85 108 84 98C83 80 78 62 68 46C60 34 64 24 78 18Z"/><path class="thin" d="M85 86C93 91 105 89 114 80"/><path class="thin" d="M97 92l2 5"/><circle class="dot" cx="79" cy="27" r="1.7"/><circle class="dot" cx="88" cy="24" r="1.7"/><path class="thick" d="M108 48l3 14"/><path class="soft" d="M18 44C20 33 43 31 47 44C51 57 47 72 35 76C30 78 28 85 20 89C14 91 9 85 11 78C13 72 13 63 14 56C14 51 16 48 18 44Z"/><ellipse class="thin" cx="15" cy="84" rx="3.2" ry="2.4"/><circle class="thin" cx="39" cy="52" r="2.2"/></g></svg><figcaption><b>5. 關機收好</b>放進盒子。</figcaption></figure>
</div>
<h2>戴在耳內</h2>
<div class="grid">
<figure><svg viewBox="0 0 240 160" aria-hidden="true"><g transform="translate(26 6) rotate(0) scale(1.2)"><path class="soft" d="M20 30C30 8 72 6 86 28C98 46 94 72 74 84C68 88 64 96 52 104C44 110 34 106 34 96C34 88 30 84 24 76C14 62 14 44 20 30Z"/><path class="thin" d="M30 34C38 18 68 16 78 32C86 46 82 64 68 72C54 80 34 72 28 58C25 50 26 42 30 34Z"/><rect class="thin" x="40" y="42" width="26" height="20" rx="4"/><path class="thin" d="M49 62v-3h8v3"/><circle class="dot" cx="55" cy="30" r="1.8"/><circle class="dot" cx="72" cy="50" r="1.8"/><ellipse class="thin" cx="43" cy="102" rx="4" ry="2.6"/></g><g transform="translate(86 134) rotate(-16) scale(1.1)"><rect class="soft" x="24" y="-4.5" width="88" height="9" rx="4.5"/><path d="M24 0H9"/><path class="thin" d="M9 -6L-5 -9M9 -3L-7 -4.5M9 0H-8M9 3L-7 4.5M9 6L-5 9"/></g></svg><figcaption><b>1. 刷開口</b>軟刷刷開口上的耳垢。</figcaption></figure>
