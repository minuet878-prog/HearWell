<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>保養線條圖審查</title>
<style>
  :root { --brand: #1f4e8c; --ink: #1c2733; --muted: #52606d; --line: #d5dce4; --tint: #e7eef7; --page: #f6f7f9; --card: #fff; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 24px 16px 48px; background: var(--page); color: var(--ink); font: 18px/1.6 "PingFang TC", "Noto Sans TC", sans-serif; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; color: var(--brand); }
  h2 { font-size: 1.2rem; margin: 28px 0 12px; }
  .lead { margin: 0 0 8px; color: var(--muted); }
  .grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); max-width: 1120px; }
  figure { margin: 0; padding: 12px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; }
  figcaption { margin-top: 8px; font-size: .95rem; }
  figcaption b { display: block; }
  svg { display: block; width: 100%; height: auto; background: #fbfcfd; border-radius: 8px; }
  svg * { fill: none; stroke: var(--brand); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  svg .soft { fill: var(--tint); }
  svg .thin { stroke-width: 2; }
  svg .dot { fill: var(--brand); stroke: none; }
</style>
</head>
<body>
<h1>日常保養的線條圖</h1>
<p class="lead">不分廠牌的簡單線條圖，共 9 張。圖只是輔助，每一步的文字都能單獨看懂。請逐張確認：外型對不對、動作會不會誤導。</p>

<h2>掛在耳後</h2>
<div class="grid">

<figure>
<svg viewBox="0 0 240 160" aria-hidden="true">
  <path class="soft" d="M150 34c24 2 38 28 34 62-2 14-15 16-20 4-7-22-18-38-32-48-9-7-3-19 18-18z"/>
  <path d="M146 34c-16-20-48-20-58 2"/>
  <path class="soft" d="M70 42c2-10 26-12 32 0 6 14-4 36-18 34-13-2-17-20-14-34z"/>
  <path class="soft thin" d="M116 112l44-18c6-2 10 0 12 5l7 18c2 5 0 9-5 11l-44 18c-5 2-9 0-11-5l-7-18c-2-5-1-9 4-11z"/>
  <path class="thin" d="M196 84c6-2 11-1 15 3M200 98c6-1 10 0 14 4"/>
</svg>
<figcaption><b>1. 擦乾淨</b>軟布擦機身和耳模。</figcaption>
</figure>

<figure>
<svg viewBox="0 0 240 160" aria-hidden="true">
  <path class="soft" d="M46 58c6-24 66-30 82-4 16 28-8 80-44 74-32-5-44-40-38-70z"/>
  <circle cx="108" cy="62" r="7"/>
  <path d="M34 22c6 10 24 18 40 16"/>
  <path d="M212 28l-82 28"/>
  <path class="thin" d="M130 46l-14 8M132 52l-15 6M134 58l-15 4M136 64l-14 2"/>
</svg>
<figcaption><b>2. 清耳垢</b>工具清耳模出口的耳垢。</figcaption>
</figure>

<figure>
<svg viewBox="0 0 240 160" aria-hidden="true">
  <path class="soft" d="M14 62h72l24 18 24-18h92v22h-92l-24-2-24 2H14z"/>
  <circle class="thin" cx="110" cy="74" r="46"/>
  <path d="M143 107l36 36"/>
</svg>
<figcaption><b>3. 看導管</b>放大鏡看導管有沒有折到。</figcaption>
</figure>

<figure>
<svg viewBox="0 0 240 160" aria-hidden="true">
  <path d="M34 78h172c0 40-30 66-86 66s-86-26-86-66z"/>
  <path class="thin" d="M46 94c12-6 22 6 34 0s22 6 34 0 22 6 34 0 22 6 34 0"/>
  <path class="soft" d="M96 74c2-14 34-16 42-2 8 16-4 38-22 36-16-2-22-20-20-34z"/>
  <path d="M122 62c0-22 18-40 44-42"/>
  <circle class="thin" cx="164" cy="116" r="5"/>
  <circle class="thin" cx="82" cy="122" r="4"/>
</svg>
<figcaption><b>4. 洗耳模</b>只有耳模和導管泡水，機身不泡。</figcaption>
</figure>

<figure>
<svg viewBox="0 0 240 160" aria-hidden="true">
  <path d="M42 84h156v38c0 12-8 20-20 20H62c-12 0-20-8-20-20z"/>
  <path d="M42 84L58 34c2-6 6-8 12-8h100c6 0 10 2 12 8l16 50"/>
  <path class="soft" d="M122 96c16 1 24 12 22 28-1 7-9 8-12 2-4-9-10-15-18-19-6-3-3-12 8-11z"/>
  <path class="soft" d="M78 104c1-6 15-7 18 0 3 7-2 18-9 17-7-1-10-10-9-17z"/>
  <path class="thin" d="M120 96c-8-7-24-7-30 6"/>
</svg>
<figcaption><b>5. 關機收好</b>放進盒子。</figcaption>
</figure>

</div>

<h2>戴在耳內</h2>
<div class="grid">

<figure>
<svg viewBox="0 0 240 160" aria-hidden="true">
  <path class="soft" d="M52 58c10-24 58-30 76-8 18 24 4 72-34 76-34 3-54-36-42-68z"/>
  <circle cx="86" cy="80" r="16"/>
  <circle class="dot" cx="118" cy="62" r="4"/>
  <circle class="dot" cx="112" cy="104" r="4"/>
  <path d="M214 30l-78 28"/>
  <path class="thin" d="M136 48l-14 8M138 54l-15 6M140 60l-15 4M142 66l-14 2"/>
</svg>
<figcaption><b>1. 刷開口</b>軟刷刷開口上的耳垢。</figcaption>
</figure>

<figure>
<svg viewBox="0 0 240 160" aria-hidden="true">
  <path class="soft" d="M52 58c10-24 58-30 76-8 18 24 4 72-34 76-34 3-54-36-42-68z"/>
  <circle cx="86" cy="80" r="16"/>
  <circle class="dot" cx="112" cy="104" r="4"/>
  <path d="M214 28l-82 28"/>
  <circle class="thin" cx="124" cy="60" r="7"/>
</svg>
<figcaption><b>2. 挑耳垢</b>刷不掉的，用工具輕輕挑。</figcaption>
</figure>

<figure>
<svg viewBox="0 0 240 160" aria-hidden="true">
  <path class="soft" d="M46 46c10-22 54-26 70-6 16 22 4 64-30 68-30 3-50-32-40-62z"/>
  <circle cx="78" cy="64" r="14"/>
  <path class="soft thin" d="M104 104l50-20c6-2 10 0 12 5l8 20c2 5 0 9-5 11l-50 20c-5 2-9 0-11-5l-8-20c-2-5-1-9 4-11z"/>
  <path class="thin" d="M192 76c6-2 11-1 15 3M196 90c6-1 10 0 14 4"/>
</svg>
<figcaption><b>3. 擦乾淨</b>乾布全部擦過。</figcaption>
</figure>

<figure>
<svg viewBox="0 0 240 160" aria-hidden="true">
  <path d="M42 84h156v38c0 12-8 20-20 20H62c-12 0-20-8-20-20z"/>
  <path d="M42 84L58 34c2-6 6-8 12-8h100c6 0 10 2 12 8l16 50"/>
  <path class="soft" d="M74 104c3-8 20-10 26-3 6 8 1 24-11 25-12 1-19-12-15-22z"/>
  <circle class="thin" cx="86" cy="112" r="5"/>
  <path class="soft" d="M140 104c3-8 20-10 26-3 6 8 1 24-11 25-12 1-19-12-15-22z"/>
  <circle class="thin" cx="152" cy="112" r="5"/>
</svg>
<figcaption><b>4. 關機收好</b>放進盒子。</figcaption>
</figure>

</div>
</body>
</html>
