<!doctype html><html lang="zh-Hant"><head><title>匯入步驟六張示意圖</title><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><style>:root{--color-primary:#1f4e8c;--color-pull:#e7eef8;--color-muted:#4a5460}
body{margin:0;font-family:-apple-system,"PingFang TC",sans-serif;font-size:18px;line-height:1.6;color:#212529;background:#fff}
main{max-width:22rem;margin:16px auto;padding:0 16px}
.step-list{list-style:none;padding:0;margin:0}
.step-list li{display:flex;gap:.75rem;margin-bottom:1rem}
.step-list-number{flex:none;width:2rem;height:2rem;border-radius:50%;background:#1f4e8c;color:#fff;display:grid;place-items:center;font-weight:700}
  .import-drawing {
    display: block;
    width: 100%;
    max-width: 12rem;
    height: auto;
    margin-top: 0.5rem;
  }

  .import-drawing * {
    fill: none;
    stroke: var(--color-primary);
    stroke-width: 2.4;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .import-drawing .frame,
  .import-drawing .field { fill: #fff; }
  .import-drawing .soft { fill: var(--color-pull); stroke: none; }
  .import-drawing .dot { fill: #fff; stroke-width: 1.6; }
  .import-drawing .sheet { fill: #fff; stroke-width: 1.6; }
  .import-drawing .thin { stroke-width: 1.6; }
  .import-drawing .tap { stroke-width: 4; }
  .import-drawing .finger { fill: #fff; }
  .import-drawing text { stroke: none; fill: var(--color-primary); font-family: inherit; }
  .import-drawing .strong { font-weight: 700; }
  .import-drawing .dim { fill: var(--color-muted); }
</style></head><body><main class="container my-6" style="max-width:24rem"><h1 class="h3">從 iPhone 匯入</h1><p>#709：本人選的畫法 A（網站藍色線條），六個步驟各一張。</p><ol class="step-list" role="list"><li><span class="step-list-number">1</span><span class="step-list-body">打開「健康」app，點下面的「瀏覽」<svg class="import-drawing" viewBox="0 0 220 330" role="img" aria-label="手機畫面示意：最下面一排的「瀏覽」被框起來"><rect class="frame" x="16" y="8" width="150" height="276" rx="20"/><rect class="soft" x="30" y="28" width="122" height="22" rx="6"/><rect class="soft" x="30" y="62" width="122" height="48" rx="6"/><rect class="soft" x="30" y="118" width="122" height="48" rx="6"/><rect class="soft" x="30" y="174" width="122" height="48" rx="6"/><line class="thin" x1="18" y1="236" x2="164" y2="236"/><text class="dim" x="50" y="262" font-size="15" text-anchor="middle">摘要</text><text class="dim" x="91" y="262" font-size="15" text-anchor="middle">共享</text><text class="word strong" x="132" y="262" font-size="15" text-anchor="middle">瀏覽</text><rect class="tap" x="110" y="242" width="44" height="28" rx="8"/><path class="finger" d="M134 275C132 265 146 262 149 270L170 317L150 327Z"/><path class="thin" d="M138 274C137 268 145 266 147 271L150 280L141 283Z"/></svg>
</span></li><li><span class="step-list-number">2</span><span class="step-list-body">點「聽力」<svg class="import-drawing" viewBox="0 0 220 330" role="img" aria-label="手機畫面示意：清單裡的「聽力」被框起來"><rect class="frame" x="16" y="8" width="150" height="276" rx="20"/><rect class="soft" x="30" y="28" width="70" height="18" rx="6"/><rect class="soft" x="28" y="58" width="126" height="34" rx="6"/><circle class="dot" cx="44" cy="75" r="7"/><text class="word" x="60" y="80" font-size="15" text-anchor="start">活動</text><rect class="soft" x="28" y="100" width="126" height="34" rx="6"/><circle class="dot" cx="44" cy="117" r="7"/><text class="word" x="60" y="122" font-size="15" text-anchor="start">心臟</text><rect class="soft" x="28" y="142" width="126" height="34" rx="6"/><circle class="dot" cx="44" cy="159" r="7"/><text class="word" x="60" y="164" font-size="15" text-anchor="start">聽力</text><rect class="soft" x="28" y="184" width="126" height="34" rx="6"/><circle class="dot" cx="44" cy="201" r="7"/><text class="word" x="60" y="206" font-size="15" text-anchor="start">睡眠</text><rect class="tap" x="24" y="138" width="134" height="42" rx="8"/><path class="finger" d="M124 185C122 175 136 172 139 180L160 227L140 237Z"/><path class="thin" d="M128 184C127 178 135 176 137 181L140 190L131 193Z"/></svg>
</span></li><li><span class="step-list-number">3</span><span class="step-list-body">點「聽力測試結果」，選要匯入的那一次<svg class="import-drawing" viewBox="0 0 220 330" role="img" aria-label="手機畫面示意：「聽力測試結果」那一列被框起來"><rect class="frame" x="16" y="8" width="150" height="276" rx="20"/><rect class="soft" x="30" y="28" width="70" height="18" rx="6"/><rect class="soft" x="30" y="58" width="122" height="56" rx="6"/><rect class="soft" x="28" y="124" width="126" height="34" rx="6"/><text class="word" x="40" y="146" font-size="15" text-anchor="start">聽力測試結果</text><rect class="soft" x="30" y="170" width="122" height="24" rx="6"/><rect class="soft" x="30" y="202" width="122" height="24" rx="6"/><rect class="tap" x="24" y="120" width="134" height="42" rx="8"/><path class="finger" d="M124 167C122 157 136 154 139 162L160 209L140 219Z"/><path class="thin" d="M128 166C127 160 135 158 137 163L140 172L131 175Z"/></svg>
</span></li><li><span class="step-list-number">4</span><span class="step-list-body">往下滑，點「輸出 PDF」<svg class="import-drawing" viewBox="0 0 220 330" role="img" aria-label="手機畫面示意：畫面下方的「輸出 PDF」被框起來"><rect class="frame" x="16" y="8" width="150" height="276" rx="20"/><rect class="soft" x="30" y="28" width="122" height="70" rx="6"/><rect class="soft" x="30" y="110" width="122" height="26" rx="6"/><rect class="soft" x="30" y="146" width="122" height="26" rx="6"/><text class="word strong" x="91" y="208" font-size="16" text-anchor="middle">輸出 PDF</text><rect class="tap" x="42" y="186" width="98" height="32" rx="8"/><path class="finger" d="M116 223C114 213 128 210 131 218L152 265L132 275Z"/><path class="thin" d="M120 222C119 216 127 214 129 219L132 228L123 231Z"/></svg>
</span></li><li><span class="step-list-number">5</span><span class="step-list-body">點分享，選「儲存到檔案」<svg class="import-drawing" viewBox="0 0 220 330" role="img" aria-label="手機畫面示意：分享選單裡的「儲存到檔案」被框起來"><rect class="frame" x="16" y="8" width="150" height="276" rx="20"/><rect class="soft" x="30" y="28" width="122" height="60" rx="6"/><rect class="sheet" x="22" y="104" width="138" height="172" rx="14"/><circle class="dot" cx="46" cy="132" r="11"/><circle class="dot" cx="78" cy="132" r="11"/><circle class="dot" cx="110" cy="132" r="11"/><circle class="dot" cx="142" cy="132" r="11"/><rect class="soft" x="32" y="158" width="118" height="30" rx="6"/><rect class="soft" x="28" y="196" width="126" height="34" rx="6"/><text class="word" x="40" y="218" font-size="15" text-anchor="start">儲存到檔案</text><rect class="soft" x="32" y="238" width="118" height="30" rx="6"/><rect class="tap" x="26" y="192" width="130" height="42" rx="8"/><path class="finger" d="M122 239C120 229 134 226 137 234L158 281L138 291Z"/><path class="thin" d="M126 238C125 232 133 230 135 235L138 244L129 247Z"/></svg>
</span></li><li><span class="step-list-number">6</span><span class="step-list-body">回到這裡，選剛剛存的 PDF<svg class="import-drawing" viewBox="0 0 220 330" role="img" aria-label="手機畫面示意：聽伴的匯入頁，選檔案的按鈕被框起來"><rect class="frame" x="16" y="8" width="150" height="276" rx="20"/><rect class="soft" x="30" y="28" width="122" height="22" rx="6"/><text class="word" x="91" y="74" font-size="13" text-anchor="middle">聽力測試的 PDF</text><rect class="field" x="30" y="84" width="122" height="34" rx="6"/><text class="word strong" x="91" y="106" font-size="14" text-anchor="middle">選擇檔案</text><rect class="soft" x="30" y="132" width="122" height="34" rx="6"/><rect class="tap" x="26" y="80" width="130" height="42" rx="8"/><path class="finger" d="M118 126C116 116 130 113 133 121L154 168L134 178Z"/><path class="thin" d="M122 125C121 119 129 117 131 122L134 131L125 134Z"/></svg>
</span></li></ol></main></body></html>
