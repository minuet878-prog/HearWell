{% extends "screening/layout.html" %}
{% load static %}

{% block title %}新增聽力圖｜HearWell{% endblock %}

{% block extra_head %}
<script type="module" src="{% static 'screening/frontend/audiogram-input.js' %}"></script>
{% endblock %}

{% block body %}
<h1 class="h3 mt-3">新增聽力圖</h1>
<p>照著醫院給的聽力檢查報告，先選要標的符號，再在圖上按住、上下拖曳到報告上的位置，放開就標好了。報告上是「無反應」（符號下面有箭頭）的頻率，往下拖出圖外就會標成無反應。</p>
<div id="audiogram-app" data-today="{{ today|date:'Y-m-d' }}" data-csrf-token="{{ csrf_token }}"></div>
<noscript><p class="fs-5 fw-bold">需要開啟 JavaScript 才能輸入聽力圖。</p></noscript>
{% endblock %}
