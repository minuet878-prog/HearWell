{# Ticket #158's score position bar, in the graded result page's result box (readability batch 3). #}
<div class="score-bar" aria-hidden="true">
    <div class="score-bar-track">
        <div class="score-bar-segments">
            {% for segment in bar.segments %}
            <div class="score-bar-segment score-bar-segment-{{ segment.color }}{% if segment.shade == "deep" %} score-bar-segment-deep{% endif %}" style="width: {{ segment.width|floatformat:2 }}%"></div>
            {% endfor %}
        </div>
        <div class="score-bar-marker" style="--position: {{ bar.position|floatformat:2 }}%"></div>
    </div>
    {# Readability batch 3: only the two ends; the level is in large type over the bar. #}
    <div class="score-bar-ends"><span>0</span><span>{{ bar.ceiling }}</span></div>
</div>
