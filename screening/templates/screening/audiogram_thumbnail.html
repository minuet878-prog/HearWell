{# Air conduction only, decorative (spec phase9_ui_refresh_4c_audiogram_thumbnails.md 4.1). #}
{% with d=audiogram.thumbnail %}
<svg class="audiogram-thumbnail" viewBox="0 0 {{ d.width }} {{ d.height }}" aria-hidden="true" focusable="false">
    <rect x="{{ d.normal.x }}" y="{{ d.normal.y }}" width="{{ d.normal.width }}" height="{{ d.normal.height }}" fill="#e9f5ec"/>
    {% for y in d.grid %}<line x1="{{ d.left_edge }}" x2="{{ d.right_edge }}" y1="{{ y }}" y2="{{ y }}" stroke="#dee2e6" stroke-width="0.6"/>{% endfor %}
    {% for line in d.lines %}<polyline points="{{ line.points }}" fill="none" stroke="{% if line.ear == 'right' %}#c0392b{% else %}#1f4e8c{% endif %}" stroke-width="1.6"/>{% endfor %}
    {% for m in d.marks %}{% if m.ear == "right" %}<circle cx="{{ m.x }}" cy="{{ m.y }}" r="2.2" fill="#fff" stroke="#c0392b" stroke-width="1.2"/>{% else %}<g transform="translate({{ m.x }} {{ m.y }})"><path d="M-2 -2L2 2M-2 2L2 -2" stroke="#1f4e8c" stroke-width="1.3"/></g>{% endif %}{% endfor %}
</svg>
{% endwith %}
