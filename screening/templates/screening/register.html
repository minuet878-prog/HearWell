{% load static %}

<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <title>{% block title %}HearWell{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootswatch/5.3.8/minty/bootstrap.min.css" rel="stylesheet"
        integrity="sha512-2rlhob8L606Mt1c8oB20JR78cIX27wzWelusr5yq+4VX6ly4F3Tr88Vhj8B63yxB7k8i1BRq3fKaiaYESpo8rA=="
        crossorigin="anonymous">
    <link href="{% static 'screening/styles.css' %}" rel="stylesheet">
    <style>
        html,
        body {
            height: 100%;
        }

        body {
            display: flex;
            align-items: center;
            padding-top: 40px;
            padding-bottom: 40px;
            background-color: #f8f9fa;
        }
    </style>
</head>

<body class="text-center">
    <div class="container">
        <h1 class="h3 mb-3 fw-normal">註冊</h1>
        {% if message %}
        <div class="mb-3 text-danger">{{message}}</div>
        {% endif %}
        <form method="post" action="{% url 'register' %}">
            {% csrf_token %}
            <div class="form-floating mb-2">
                <input autofocus class="form-control" id="floatingInput" type="text" name="username"
                    placeholder="Username">
                <label for="floatingInput">使用者名稱</label>
            </div>

            <div class="form-floating mb-2">
                <input class="form-control" id="floatingEmail" type="email" placeholder="電子信箱地址" name="email">
                <label for="floatingEmail">電子郵件</label>
            </div>

            <div class="form-floating mb-2">
                <input class="form-control" id="floatingPassword" type="password" name="password"
                    placeholder="Password">
                <label for="floatingPassword">密碼</label>
            </div>

            <div class="form-floating mb-2">
                <input class="form-control" id="floatingConfirmation" type="password" name="confirmation"
                    placeholder="Cofirmation">
                <label for="floatingConfirmation">請再輸入一次</label>
            </div>
            <input class="w-100 btn btn-lg btn-primary" type="submit" value="註冊">
        </form>

        已經有帳號了嗎？ <a href="{% url 'login' %}">從這裡登入</a>
    </div>

</body>

</html>
