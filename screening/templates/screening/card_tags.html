{# The tags inside a .card-tags element; a pause for screen readers between them. #}
<span class="card-tag">{{ questionnaire.question_count }} 題</span><span class="visually-hidden">，</span><span class="card-tag">約 {{ questionnaire.definition.minutes }} 分鐘</span>{% if questionnaire.last_answered_at %}<span class="visually-hidden">，</span><span class="card-tag">上次 {{ questionnaire.last_answered_at|date:"Y/m/d" }}</span>{% endif %}
