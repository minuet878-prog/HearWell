{% load static %}

<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <title>{% block title %}HearWell{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootswatch/5.3.8/minty/bootstrap.min.css" rel="stylesheet"
        integrity="sha512-2rlhob8L606Mt1c8oB20JR78cIX27wzWelusr5yq+4VX6ly4F3Tr88Vhj8B63yxB7k8i1BRq3fKaiaYESpo8rA=="
        crossorigin="anonymous">
    <link href="{% static 'screening/styles.css' %}" rel="stylesheet">
    <style>
        html,
        body {
            height: 100%;
        }

        body {
            display: flex;
            align-items: center;
            padding-top: 40px;
            padding-bottom: 40px;
            background-color: #f8f9fa;
        }
    </style>
</head>

<body class="text-center">
    <div class="container">
        <h1 class="h3 mb-3 fw-normal">Welcome</h1>
        {% if message %}
        <div class="mb-3 text-danger">{{message}}</div>
        {% endif %}
        <form method="post" action="{% url 'login' %}">
            {% csrf_token %}
            <div class="form-floating mb-2">
                <input autofocus class="form-control" id="floatingInput" type="text" name="username"
                    placeholder="Username">
                <label for="floatingInput">使用者名稱</label>
            </div>

            <div class="form-floating mb-2">
                <input class="form-control" id="floatingPassword" type="password" name="password"
                    placeholder="Password">
                <label for="floatingPassword">密碼</label>
            </div>
            <div class="d-flex gap-2">
                <input class="w-50 btn btn-lg btn-primary" type="submit" value="登入">
                <a href="{% url 'register' %}" class="w-50 btn btn-lg btn-outline-primary">註冊</a>
            </div>
        </form>
    </div>

</body>

</html>
