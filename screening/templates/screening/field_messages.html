{# Errors and help text with the ids Django puts in the input's aria-describedby. #}
{% if field.errors %}
<div id="{{ field.auto_id }}_error">
    {% for error in field.errors %}
    <p class="text-danger field-error mb-0">{{ error }}</p>
    {% endfor %}
</div>
{% endif %}
{% if field.help_text %}
<div id="{{ field.auto_id }}_helptext" class="{{ help_class|default:"text-black" }} mt-1">{{ field.help_text }}</div>
{% endif %}
