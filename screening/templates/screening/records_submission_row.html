{# One record of a 我的紀錄 tab, shown or folded under 看以前的 N 筆 (#465). #}
<a class="link-card" href="{% url 'result' submission.id %}">
    <span class="link-card-body">
        <strong>{{ submission.created_at|date:"Y/m/d" }}{% if submission.id in same_day %} {{ submission.created_at|date:"H:i" }}{% endif %}</strong>
        {% include submission.result.row_template %}
    </span>
    <span class="link-card-arrow" aria-hidden="true">›</span>
</a>
