{% extends "screening/layout.html" %}

{% block body %}
{% for submission in submissions %}
<div>
    <ul>
        <li>{{ submission.created_at|date:"Y/m/d" }} 總分:{{ submission.total_score }} 結果:{{ submission.classified }}<a
                href="{% url 'result' submission.id %}">連結</a></li>
    </ul>
</div>
{% empty %}
<p>你還沒有做過篩檢紀錄</p>
{% endfor %}
{% endblock %}
