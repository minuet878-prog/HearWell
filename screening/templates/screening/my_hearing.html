{% extends "screening/layout.html" %}

{% block body %}
{% for submission in submissions %}
<div class="card mb-2 mt-2">
    <div class="card-body d-flex justify-content-between align-items-center">
        <span class="text-muted fs-4">{{ submission.created_at|date:"Y/m/d" }} 總分:{{ submission.total_score }}
            </span><span class="text-{{ submission.classified.color }} fs-4">
            {{ submission.classified.text }}</span><a class="btn btn-primary mb-2 ms-2"
            href="{% url 'result' submission.id %}">連結</a>
    </div>
</div>
{% empty %}
<p>你還沒有做過篩檢紀錄</p>
{% endfor %}
{% endblock %}
