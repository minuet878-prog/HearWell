<section class="mb-4 family-sources" aria-labelledby="sources-title">
    <h2 id="sources-title" class="h5 heading-bar">出處</h2>
    <ul>
        {% for title, url in sources %}
        <li><a href="{{ url }}">{{ title }}</a></li>
        {% endfor %}
    </ul>
    <p class="guide-checked mb-0">內容查核於 {{ checked_on|date:"Y/m/d" }}。</p>
</section>
