    <p>請依您目前實際生活經驗作答。選「沒戴」時，依您目前不戴助聽器時的實際經驗；選「有戴」時，依您目前戴著助聽器的經驗；經驗不足可以先不填，不必兩種狀態都完成。</p>
    <p>每題選 0–10 的整數或「不適用」。一般題目完全不行選 0，輕鬆做到選 10；請留意各題自己的尺規說明。未操作不算回答。</p>
    <p>十二題都有分數才計算整體平均；含不適用仍可保存逐題回答。這是網站審定規則，未宣稱與原紙本電子施測等效或已完成高齡驗證。</p>
