<section class="q-intro-row py-1 first:pt-0" data-icon="who">
    <h2 class="q-intro-title">適合誰</h2>
    <p>適合 18–64 歲成人；若您持續使用原問卷追蹤，也可以繼續填寫。</p>
</section>
<section class="q-intro-row py-1 first:pt-0" data-icon="how">
    <h2 class="q-intro-title">怎麼回答</h2>
    <p>請依照您最近一段期間的實際生活經驗，每題選「<strong>會</strong>」、「<strong>有時</strong>」或「<strong>不會</strong>」，每一題都要回答。</p>
</section>
<section class="q-intro-row py-1 first:pt-0" data-icon="note">
    <h2 class="q-intro-title">有戴、沒戴怎麼選</h2>
    <p>選擇「沒戴」時，請依沒有配戴助聽器的生活經驗作答；選擇「有戴」時，請依目前這副助聽器的生活經驗作答。</p>
</section>
