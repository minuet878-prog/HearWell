    <p>請依照您最近一段期間的實際生活經驗，每題選「會」、「有時」或「不會」，每一題都要回答。選擇「沒戴」時，請依沒有配戴助聽器的生活經驗作答；選擇「有戴」時，請依目前這副助聽器的生活經驗作答。</p>
