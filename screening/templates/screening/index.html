{% extends "screening/layout.html" %}

{% block body %}
<div class="text-center mb-4">
    <p class="display-3 fw-bold text-primary mt-3">7-10 年</p>
    <p class="fs-3">從察覺聽力問題到實際就醫，平均要拖這麼久</p>
</div>
<div class="card">
    <div class="card-body">
        <p class="fw-bold">這段延遲的代價不只是聽不清楚——研究顯示未經處理的聽力損失與社交孤立、認知退化有顯著關聯。</p>
        <p class="fw-bold">HearWell 的設計目標是縮短這段延遲：讓使用者能在家中完成標準化的聽力障礙自評、記錄日常聆聽困難的具體情境、以白話理解自己的聽力檢查結果，並在需要時被引導至專業協助。</p>
        <p class="text-muted">本專案由執業聽力師開發，篩檢工具採用經驗證的 HHIE-S 量表。</p>
    </div>
</div>
<div class="text-center mt-4">
    <a class="btn btn-primary btn-lg" href="{% url 'questionnaire_list' %}">3 分鐘了解我的聽力狀況</a>
</div>

{% endblock %}
